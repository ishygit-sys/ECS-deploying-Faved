name: build and push image

on: 
  workflow_dispatch:    # allows running workflow in github for testing purposes
  push:
    branches:    
      - main    # pushes on main branch
    paths:         # only enables workflow when these files are changes ( only the application and focker files)
      - 'app/**'       
      - 'Dockerfile'
      - '.dockerignore'


permissions:      # permission needed for OIDC
  id-token: write
  contents: read


jobs:
  build-and-deploy: 
    runs-on: ubuntu-latest

    steps:
      - name: repo content
        uses: actions/checkout@v4   # downloads repo content onto runner


      - name: configure aws-credential with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::506199645995:role/github-actions-deploy
          aws-region: eu-west-2 


      - name: AWS log in
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: List repository contents
        run: ls -la


      - name: build,tag push image to amazon ECR
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ecs-project
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          